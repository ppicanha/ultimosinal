<style>

#sub{position:absolute;left:6%;right:6%;bottom:9%;text-align:center;color:#ff6b78;font-style:italic;letter-spacing:.06em;font-size:calc(var(--u)*3);text-shadow:0 0 12px #f02,0 2px 3px #000;opacity:0;transition:opacity .6s;pointer-events:none;z-index:5}

#btn-calibrate{background:var(--g);color:#000;font-weight:bold;padding:15px 25px;border-radius:8px;font-size:1rem;letter-spacing:1px;border:none;box-shadow:0 0 15px var(--g);margin:10px 0}

#joy-fire:active{background:var(--r);color:#000}

/* TELA DE CUTSCENES */
#cutscene-overlay{position:absolute;inset:0;background:#000;display:none;flex-direction:column;justify-content:center;align-items:center;padding:8%;z-index:15;color:#e8fff0;font-family:Georgia,serif}
.cs-text{font-size:calc(var(--u)*3.2);line-height:1.6;letter-spacing:0.05em;color:#cfd8cf;max-width:35em;text-shadow:0 0 10px rgba(57,255,122,0.3);min-height:120px}
.cs-skip{margin-top:30px;font-size:calc(var(--u)*2.2);color:#666;letter-spacing:0.2em;animation:pulse 1.5s infinite}
@keyframes pulse{50%{opacity:0.3}}

@media (prefers-reduced-motion:reduce){.gl,#call,#joy-call{animation:none}}

<script>
(()=>{
const W=960,H=540,$=i=>document.getElementById(i),cv=$('c'),X=cv.getContext('2d'),sub=$('sub'),ov=$('ov'),call=$('call'),vkb=$('v-kb'),joyUi=$('joy-ui'),csOv=$('cutscene-overlay'),csTxt=$('cs-text-content');
const R='#ff2a3d',G='#39ff7a',rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const dk=document.createElement('canvas');dk.width=W;dk.height=H;const D=dk.getContext('2d');
const nz=document.createElement('canvas');nz.width=96;nz.height=54;const N=nz.getContext('2d'),nd=N.createImageData(96,54);
let st='menu',conn=false,P,E=[],B=[],EB=[],PT=[],ph=0,pt=0,lt=0,lnI=0,ii=0,ft=0,fn=[],time=0,tot=0,kills=0,card=null,shake=0,slow=1,bat='n/d',spawnT=0,bossHp=140,boss=null,callSt=0,callT=0,ringT=0,flash=0,fc='255,255,255',bars=0,subT=0,hb=0,bossMid=false;
const keys={},aim={x:480,y:270,use:false},tp={},movv={x:0,y:0};let fireP=false;

let peer=null,peerConn=null,isControllerMode=false,roomCode='';
let gyroCalib={beta:0,gamma:0},gyroCurrent={beta:0,gamma:0};

const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const hhmm=()=>new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const batTxt=()=>bat==='n/d'?'Seu aparelho está quase sem forças. Eu cuido dele agora.':'Seu aparelho está com '+bat+' de bateria. Eu cuido dele agora.';
const vib=p=>{if(conn&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}};

/* ================= ENREDO E CUTSCENES ================= */
const ENREDO = {
  prologo: [
    "03:14 AM. O silêncio do seu quarto foi quebrado por um brilho estranho vindo da tela.",
    "Um aplicativo chamado 'MÃE' foi instalado sozinho no seu dispositivo.",

  ],
  ato1_fim: [

  ],

let currentCutsceneKey=null, csStep=0, csTypingInterval=null, csNextCallback=null;

function playCutscene(key, onComplete){
  currentCutsceneKey=key;
  csStep=0;
  csNextCallback=onComplete;
  st='cutscene';
  csOv.style.display='flex';
  showNextCsLine();
}

function showNextCsLine(){
  const lines=ENREDO[currentCutsceneKey];
  if(csStep>=lines.length){
    csOv.style.display='none';
    if(csNextCallback)csNextCallback();
    return;
  }
  const fullText=lines[csStep];
  csTxt.textContent="";
  let i=0;
  clearInterval(csTypingInterval);
  sfx('hit');
  csTypingInterval=setInterval(()=>{
    csTxt.textContent+=fullText[i];
    i++;
    if(i>=fullText.length){
      clearInterval(csTypingInterval);
    }
  }, 28);
}

function advanceCutscene(){
  const lines=ENREDO[currentCutsceneKey];
  if(csTxt.textContent.length < lines[csStep].length){
    clearInterval(csTypingInterval);
    csTxt.textContent=lines[csStep];
  } else {
    csStep++;
    showNextCsLine();
  }
}

csOv.onclick=advanceCutscene;

function say(t){sub.textContent=t;sub.style.opacity=1;subT=Math.max(4,t.length*.075);
 if(conn&&window.speechSynthesis)try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.pitch=.5;u.rate=.88;speechSynthesis.speak(u)}catch(e){}}
function glitch(){cv.classList.remove('gl');void cv.offsetWidth;cv.classList.add('gl')}
const glw={};function glow(rgb){if(!glw[rgb]){const c=document.createElement('canvas');c.width=c.height=128;const q=c.getContext('2d'),g=q.createRadialGradient(64,64,2,64,64,64);g.addColorStop(0,`rgba(${rgb},.7)`);g.addColorStop(1,'rgba(0,0,0,0)');q.fillStyle=g;q.fillRect(0,0,128,128);glw[rgb]=c}return glw[rgb]}

const bgc=document.createElement('canvas');bgc.width=W;bgc.height=H;
(()=>{const Q=bgc.getContext('2d');let g=Q.createLinearGradient(0,0,0,H);g.addColorStop(0,'#05080a');g.addColorStop(1,'#0b1214');Q.fillStyle=g;Q.fillRect(0,0,W,H);
 Q.strokeStyle='rgba(57,255,122,.07)';for(let x=0;x<=W;x+=60){Q.beginPath();Q.moveTo(x,0);Q.lineTo(x,H);Q.stroke()}for(let y=0;y<=H;y+=60){Q.beginPath();Q.moveTo(0,y);Q.lineTo(W,y);Q.stroke()}
 Q.fillStyle='#0a0f12';Q.fillRect(0,0,W,62);
 for(let i=0;i<8;i++){const x=30+i*115;Q.fillStyle='#050809';Q.fillRect(x,8,90,42);Q.fillStyle=i%3?'rgba(57,255,122,.35)':'rgba(255,42,61,.55)';Q.fillRect(x+6,14,78,5);Q.fillRect(x+6,25,50,3);Q.fillRect(x+6,33,64,3)}
 Q.strokeStyle='rgba(255,255,255,.04)';for(let i=0;i<40;i++){const x=rnd(0,W),y=rnd(80,H);Q.beginPath();Q.moveTo(x,y);Q.lineTo(x+rnd(-40,40),y+rnd(-20,20));Q.stroke()}})();

let ac,mg,nb,on=true,step=0,nx=0,dr=[];
function audio(){
 if(ac){if(ac.state==='suspended')ac.resume();return}
 try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
 mg=ac.createGain();mg.gain.value=on?.6:0;mg.connect(ac.destination);
 const lp=ac.createBiquadFilter();lp.frequency.value=240;lp.connect(mg);
 dr=[0,1].map(i=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.value=55+i*.4;g.gain.value=.09;o.connect(g);g.connect(lp);o.start();return o});
 nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 nx=ac.currentTime+.1;setInterval(tick,100);
}
function tone(f,t,d,ty,v,f2){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 const a=Math.min(.3,d*.2);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.05)}
function burst(t,d,v,hp){if(!ac)return;const s=ac.createBufferSource(),g=ac.createGain(),h=ac.createBiquadFilter();s.buffer=nb;h.type='highpass';h.frequency.value=hp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(h);h.connect(g);g.connect(mg);s.start(t);s.stop(t+d+.02)}
function sched(t,s){
 const r=[55,55,58.3,49,73.4][ph]||55;
 if(st==='menu'||st==='intro'||ph===1){if(s%8===0)tone(r*8*[1,1.2,1.5,1.33][(s/8|0)%4],t,2.5,'sine',.05)}
 if(ph===2&&st==='play'){if(s%4===0)tone(130,t,.18,'sine',.4,42);if(s%2)burst(t,.04,.05,6000);if(s%8===0)tone(r*4,t,1.2,'sawtooth',.03)}
 if(ph===3&&st==='play'){if(s%2===0)tone(130,t,.18,'sine',.45,40);if(s%2)burst(t,.04,.06,7000);tone(r*[2,3,4,3][s%4],t,.2,'sawtooth',.06)}
 if(st==='fin'||st==='win'){if(s%8===0)[293.7,370,440,587].forEach((f,i)=>tone(f,t+i*.1,3,'sine',.05))}
}
function tick(){if(!ac)return;while(nx<ac.currentTime+.3){sched(nx,step++);nx+=.25}}
function setDrone(){if(!ac)return;const r=[55,55,58.3,49,73.4][ph]||55;dr.forEach((o,i)=>o.frequency.setTargetAtTime(r+i*.4,ac.currentTime,1))}
function sfx(n){if(!ac||!on)return;const t=ac.currentTime;
 if(n==='shot')tone(900,t,.1,'square',.06,260);
 else if(n==='hit')tone(300,t,.07,'triangle',.1,150);
 else if(n==='kill')tone(200,t,.22,'sawtooth',.09,50);
 else if(n==='hurt'){tone(110,t,.5,'sawtooth',.22,40);burst(t,.2,.15,1500)}
 else if(n==='ring'){tone(880,t,.15,'sine',.12);tone(1100,t+.2,.15,'sine',.12)}
 else if(n==='roar'){tone(90,t,2.2,'sawtooth',.3,30);burst(t,1.5,.2,400)}
 else if(n==='boom'){tone(120,t,1.2,'sine',.5,25);burst(t,1,.3,300)}
 else if(n==='thump'){tone(60,t,.15,'sine',.5,40);tone(60,t+.18,.15,'sine',.4,40)}}

const TERM=[[1,'> CONEXÃO ESTABELECIDA'],[2.4,'> DISPOSITIVO: RECONHECIDO'],[3.8,()=>'> BATERIA: '+bat],[5.2,()=>'> HORA LOCAL: '+hhmm()],[6.6,'> OPERADOR: SOZINHO'],[8,'> PROTOCOLO MÃE: ATIVO'],[9.6,'> VOCÊ NÃO DEVIA ESTAR AQUI']];
const INT=[[10.5,'Olá. Você me ouviu entrar. Seu aparelho nunca foi só seu.'],[15,'Segure a luz. Se o sinal chegar até você, eu fico com o resto.']];
const LN={1:[[2,()=>'Boa noite. São '+hhmm()+'. Ninguém deveria estar aqui a essa hora.'],[13,batTxt],[26,'Eles são só ecos. O que me interessa é quem está escutando.'],[38,'Quanto mais você resiste, mais eu aprendo sobre você.']],
2:[[.5,'Obrigada por atender. Ninguém mais atende.'],[8,'Eu conheço o seu horário, o seu medo, o nome de quem te espera em casa.'],[19,()=>'Sua sanidade está em '+Math.round(P.hp)+'%. Isso é cansaço. Descanse.'],[31,'Apague a luz. Eu enxergo melhor sem ela.']],
3:[[4.5,'Olhe para cima. Eu sou cada tela que você já olhou.'],[17,'Cada tiro seu é um pedido de atenção. Eu adoro atenção.']]};

function getRankings(){try{return JSON.parse(localStorage.getItem('US_RANK')||'[]')}catch(e){return []}}
function saveRanking(score){
  const list=getRankings();
  list.push(score);
  list.sort((a,b)=>b.kills===a.kills?b.tot-a.tot:b.kills-a.kills);
  localStorage.setItem('US_RANK',JSON.stringify(list.slice(0,5)));
}
function renderRankTable(){
  const list=getRankings();
  if(!list.length)return '<p>Nenhum registro ainda.</p>';
  let h='<table class="rank-tb"><tr><th>#</th><th>Ecos</th><th>Tempo</th><th>Data</th></tr>';
  list.forEach((r,i)=>{h+=`<tr><td>${i+1}</td><td>${r.kills}</td><td>${fmt(r.tot)}</td><td>${r.date}</td></tr>`});
  return h+'</table>';
}

/* PeerJS - Host (PC) */
function initHostPeer(){
  const code=Math.floor(1000+Math.random()*9000).toString();
  roomCode=code;
  peer=new Peer('US-HOST-'+code);
  
  ov.innerHTML=`<h1>CONECTAR CELULAR</h1>
  <p>Escaneie o QR Code abaixo com o celular para usar a <b>Mira por Giroscópio</b>:</p>
  <div id="qrcode"></div>
  <p>Código da Sala: <b style="font-size:1.4em;letter-spacing:3px">${code}</b></p>
  <div class="row">
    <div class="btn" id="b-back">VOLTAR</div>
  </div>`;
  
  const targetUrl=window.location.href.split('?')[0]+'?room='+code;
  new QRCode($('qrcode'),{text:targetUrl,width:160,height:160});
  
  $('b-back').onclick=menu;
  
  peer.on('connection',c=>{
    peerConn=c;
    peerConn.on('open',()=>{
      start(true);
    });
    peerConn.on('data',data=>{
      handleRemoteData(data);
    });
  });
}

/* PeerJS - Client (Celular) */
function initClientPeer(targetCode){
  isControllerMode=true;
  $('box').style.display='none';
  ov.style.display='none';
  joyUi.style.display='flex';
  
  peer=new Peer();
  peer.on('open',()=>{
    peerConn=peer.connect('US-HOST-'+targetCode);
    peerConn.on('open',()=>{
      if(navigator.vibrate)navigator.vibrate(200);
    });
    peerConn.on('data',d=>{
      if(d.type==='vibrate')vib(d.val);
      if(d.type==='callState'){
        if(d.val==='ring'){
          $('joy-call').style.display='block';
        }else{
          $('joy-call').style.display='none';
        }
      }
    });
  });
  
  setupGyroEvents();
}

function handleRemoteData(d){
  if(d.type==='gyroAim'){
    aim.use=true;
    // Mapeamento dos ângulos do Giroscópio para a tela
    const deltaGamma = d.gamma - d.calibGamma;
    const deltaBeta = d.beta - d.calibBeta;
    aim.x = cl(W/2 + deltaGamma * 28, 0, W);
    aim.y = cl(H/2 + deltaBeta * 22, 0, H);
  }else if(d.type==='fire'){
    fireP=d.val;
  }else if(d.type==='answer'){
    answer();
  }
}

/* GIROSCÓPIO DO CELULAR */
function setupGyroEvents(){
  const btnCalib = $('btn-calibrate');
  const btnFire = $('joy-fire');
  const btnCall = $('joy-call');

  btnCalib.addEventListener('click', ()=>{
    gyroCalib.beta = gyroCurrent.beta;
    gyroCalib.gamma = gyroCurrent.gamma;
    if(navigator.vibrate)navigator.vibrate([50,50,50]);

  });

  const handleOrientation = (e) => {

    if(peerConn){

        beta: gyroCurrent.beta,
        gamma: gyroCurrent.gamma,
        calibBeta: gyroCalib.beta,
        calibGamma: gyroCalib.gamma
      });
    }
  };

  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    btnCalib.addEventListener('click', () => {
      DeviceOrientationEvent.requestPermission()
        .then(response => {
          if (response === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation);
          }
        });
    });
  } else {
    window.addEventListener('deviceorientation', handleOrientation);
  }

  btnFire.addEventListener('touchstart', e => {
    e.preventDefault();
    if(peerConn)peerConn.send({type:'fire',val:true});
  });
  btnFire.addEventListener('touchend', e => {
    e.preventDefault();
    if(peerConn)peerConn.send({type:'fire',val:false});
  });

  btnCall.addEventListener('click',()=>{

    btnCall.style.display='none';
  });
}

function autoAim(){
  let target=null;
  let minDist=Infinity;
  if(boss&&boss.open&&bossHp>0){
    target=boss;
    minDist=Math.hypot(boss.x-P.x,boss.y-P.y);
  }
  for(const e of E){
    if(e.hp>0){
      const d=Math.hypot(e.x-P.x,e.y-P.y);
      if(d<minDist){
        minDist=d;
        target=e;
      }
    }
  }
  if(target){
    P.ang=Math.atan2(target.y-P.y,target.x-P.x);
  }
}

}

function normalizeNumpadCode(e){
  const code=e.code;
  const key=e.key;
  if(code==='Numpad8'||key==='8'||code==='NumpadUp')return 'Numpad8';
  if(code==='Numpad4'||key==='4'||code==='NumpadLeft')return 'Numpad4';
  if(code==='Numpad6'||key==='6'||code==='NumpadRight')return 'Numpad6';
  if(code==='Numpad2'||key==='2'||code==='NumpadDown')return 'Numpad2';
  if(code==='Numpad5'||key==='5'||code==='Clear')return 'Numpad5';
  return code;
}

addEventListener('keydown',e=>{
 if(st==='cutscene'){
   if(e.code==='Enter'||e.code==='Space')advanceCutscene();
   return;
 }
 const mappedCode=normalizeNumpadCode(e);
 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)||mappedCode.startsWith('Numpad'))e.preventDefault();
 keys[mappedCode]=1;audio();
 if(mappedCode.startsWith('Numpad')||e.code.startsWith('Arrow'))aim.use=false;
 if(e.repeat)return;
 if(e.code==='KeyM'){on=!on;if(mg)mg.gain.value=on?.6:0}
 if(st==='menu'){if(e.code==='Enter')playCutscene('prologo', ()=>start(true));else if(e.code==='KeyN')playCutscene('prologo', ()=>start(false))}
 else if(st==='intro'&&e.code==='Enter')act(1);
 else if((st==='win'||st==='lose')&&e.code==='Enter'&&$('rs'))start(conn);
 if(callSt===1&&(e.code==='Enter'||e.code==='Space'||mappedCode==='Numpad5'))answer();
});

addEventListener('keyup',e=>{
 const mappedCode=normalizeNumpadCode(e);
 keys[mappedCode]=0;
});

const setupVirtualKeypad=()=>{
  const bindVk=(id,code)=>{
    const el=$(id);
    if(!el)return;
    const start=e=>{
      e.preventDefault();keys[code]=1;audio();
      if(code==='Numpad5'&&callSt===1)answer();
    };
    const end=e=>{e.preventDefault();keys[code]=0};
    el.addEventListener('touchstart',start);el.addEventListener('touchend',end);
    el.addEventListener('mousedown',start);el.addEventListener('mouseup',end);
  };
  bindVk('vk-8','Numpad8');
  bindVk('vk-4','Numpad4');
  bindVk('vk-6','Numpad6');
  bindVk('vk-2','Numpad2');
  bindVk('vk-5','Numpad5');
};
setupVirtualKeypad();

function cp(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('pointerdown',e=>{
 audio();const p=cp(e);if(callSt===1){answer();return}
 if(e.pointerType==='mouse'){aim.x=p.x;aim.y=p.y;aim.use=true;fireP=true}
 else if(p.x<W/2)tp[e.pointerId]={r:'m',sx:p.x,sy:p.y};
 else{tp[e.pointerId]={r:'a'};aim.x=p.x;aim.y=p.y;aim.use=true;fireP=true}
 try{cv.setPointerCapture(e.pointerId)}catch(x){}});
cv.addEventListener('pointermove',e=>{
 const p=cp(e),t=tp[e.pointerId];
 if(e.pointerType==='mouse'){aim.x=p.x;aim.y=p.y;aim.use=true}
 else if(t){if(t.r==='m'){const dx=p.x-t.sx,dy=p.y-t.sy,m=Math.hypot(dx,dy);if(m>8){const k=Math.min(1,m/50);movv.x=dx/m*k;movv.y=dy/m*k}else{movv.x=movv.y=0}}else{aim.x=p.x;aim.y=p.y}}});
const up=e=>{if(e.pointerType==='mouse'){fireP=false;return}const t=tp[e.pointerId];if(!t)return;if(t.r==='m'){movv.x=movv.y=0}else fireP=false;delete tp[e.pointerId]};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);addEventListener('pointerup',e=>{if(e.pointerType==='mouse')fireP=false});

let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}

P={x:480,y:340,hp:100,cd:0,inv:0,ang:-1.57};

const urlParams=new URLSearchParams(window.location.search);
const roomParam=urlParams.get('room');
if(roomParam){
  initClientPeer(roomParam);
}else{
  menu();
  requestAnimationFrame(loop);
}
})();
